<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Location Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #09090b;
      --fg: #fafafa;
      --muted: #a1a1aa;
      --border: #27272a;
      --header-bg: #18181b;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--fg);
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.5rem;
      background: var(--header-bg);
      border-bottom: 1px solid var(--border);
      z-index: 1000;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .header h1 {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .user-name {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .btn {
      padding: 0.4rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      background: transparent;
      color: var(--fg);
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }

    .btn:hover { background: var(--border); }

    .btn-active {
      background: #22c55e;
      border-color: #22c55e;
      color: #000;
      font-weight: 600;
    }

    .btn-active:hover { background: #16a34a; }

    .stats-bar {
      display: flex;
      gap: 1.5rem;
      padding: 0.5rem 1.5rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--muted);
      background: var(--header-bg);
      z-index: 1000;
    }

    .stats-bar span { font-weight: 600; color: var(--fg); }

    #map {
      flex: 1;
      z-index: 1;
    }

    .toast {
      display: none;
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      padding: 0.75rem 1.25rem;
      background: #ef4444;
      color: white;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      font-weight: 500;
      z-index: 2000;
      animation: fadeIn 0.2s;
    }

    .toast.success { background: #22c55e; color: #000; }

    @keyframes fadeIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <span>📍</span>
      <h1>Live Location Tracker</h1>
    </div>
    <div class="header-right">
      <button class="btn" id="shareBtn" onclick="toggleSharing()">Start Sharing</button>
      <span class="user-name" id="userName"></span>
      <a href="/auth/logout" class="btn">Sign out</a>
    </div>
  </div>

  <div class="stats-bar">
    <div>Status: <span id="sharingStatus">Not sharing</span></div>
    <div>Active users: <span id="activeCount">0</span></div>
    <div>My coords: <span id="myCoords">—</span></div>
  </div>

  <div id="map"></div>
  <div class="toast" id="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let map;
    let markers = {}; // userId -> Leaflet marker
    let sharing = false;
    let watchId = null;
    let myUserId = null;

    // Initialize map
    function initMap() {
      map = L.map('map').setView([20, 0], 3);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19,
      }).addTo(map);
    }

    // Show toast
    function showToast(message, type = 'error') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast' + (type === 'success' ? ' success' : '');
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    // Load user info
    (async () => {
      try {
        const res = await fetch('/auth/me');
        const user = await res.json();
        document.getElementById('userName').textContent = user.name || user.email;
        myUserId = user.sub;
      } catch {}
    })();

    // Toggle location sharing
    function toggleSharing() {
      if (!sharing) {
        startSharing();
      } else {
        stopSharing();
      }
    }

    function startSharing() {
      if (!navigator.geolocation) {
        showToast('Geolocation is not supported by your browser.');
        return;
      }

      navigator.geolocation.getCurrentPosition(
        () => {
          // Permission granted — start watching
          watchId = navigator.geolocation.watchPosition(
            (position) => {
              const { latitude, longitude } = position.coords;
              document.getElementById('myCoords').textContent =
                `${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;

              socket.emit('client:location-update', {
                lat: latitude,
                lng: longitude,
              });
            },
            (err) => {
              showToast('Location error: ' + err.message);
            },
            { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
          );

          sharing = true;
          document.getElementById('shareBtn').textContent = 'Stop Sharing';
          document.getElementById('shareBtn').classList.add('btn-active');
          document.getElementById('sharingStatus').textContent = 'Sharing live';
          showToast('Location sharing started!', 'success');
        },
        (err) => {
          showToast('Permission denied: ' + err.message);
        }
      );
    }

    function stopSharing() {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      sharing = false;
      document.getElementById('shareBtn').textContent = 'Start Sharing';
      document.getElementById('shareBtn').classList.remove('btn-active');
      document.getElementById('sharingStatus').textContent = 'Not sharing';
      document.getElementById('myCoords').textContent = '—';
    }

    // Create or update a marker on the map
    function upsertMarker(userId, lat, lng, name) {
      if (markers[userId]) {
        markers[userId].setLatLng([lat, lng]);
      } else {
        const isMe = userId === myUserId;
        const marker = L.marker([lat, lng])
          .addTo(map)
          .bindPopup(`<b>${name || 'User'}</b>${isMe ? ' (You)' : ''}`);

        if (isMe) {
          marker.setIcon(L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png',
            shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41],
          }));
        }

        markers[userId] = marker;
      }
      updateActiveCount();
    }

    // Remove a marker
    function removeMarker(userId) {
      if (markers[userId]) {
        map.removeLayer(markers[userId]);
        delete markers[userId];
      }
      updateActiveCount();
    }

    function updateActiveCount() {
      document.getElementById('activeCount').textContent = Object.keys(markers).length;
    }

    // ---- Socket Events ----
    socket.on('connect_error', (err) => {
      if (err.message === 'Authentication required' || err.message === 'Token expired') {
        window.location.href = '/login.html';
      }
    });

    socket.on('server:error', (data) => {
      showToast(data.error);
    });

    // Receive initial locations of all active users
    socket.on('server:initial-locations', (locations) => {
      for (const loc of locations) {
        upsertMarker(loc.userId, loc.lat, loc.lng, loc.name);
      }
      updateActiveCount();
    });

    // Receive live location update
    socket.on('server:location-update', (data) => {
      upsertMarker(data.userId, data.lat, data.lng, data.name);
    });

    // User disconnected
    socket.on('server:user-disconnected', (data) => {
      removeMarker(data.userId);
    });

    // Init
    window.addEventListener('load', () => {
      initMap();
    });
  </script>
</body>
</html>
